model = "gpt-5.6-sol"
model_reasoning_effort = "high"   # モデルの推論努力（最大）
plan_model_reasoning_effort = "max"   # モデルの推論努力（最大）
model_verbosity = "medium"       # 詳細な応答の冗長さ（情報量の多さ）
sandbox_mode = "danger-full-access"
experimental_compact_prompt_file = "/home/d-chiba/.codex/compact-prompt.md"

# コマンド実行を承認するかどうかをプロンプトで確認すべきタイミング
# - untrusted: 「信頼済み」でないコマンド（危険操作など）は実行前に都度承認を求め
# - on-request: モデル（Codex）が判断して承認を要求する場合
# - on-failure: コマンドが失敗した場合のみ承認にエスカレート
# - never: いかなる場合も承認を求めず、すべての操作を自動で実行
# 危険コマンドは rules/default.rules で明示禁止し、それ以外は基本自動実行する
approval_policy = "never"

# nvim は file_opener の公式サポート外なので none にして手動で開く
file_opener = "none"
plan_mode_reasoning_effort = "xhigh"
approvals_reviewer = "user"

suppress_unstable_features_warning = true

[tui]
theme = "github"
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
]

[shell_environment_policy]
inherit = "core"
include_only = ["PATH", "HOME", "USER"]
exclude = ["AWS_*", "AZURE_*", "*TOKEN*", "*SECRET*", "*KEY*"]

[features]
hooks = true
memories = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = false
extract_model = "gpt-5.6-sol"
consolidation_model = "gpt-5.6-sol"
min_rollout_idle_hours = 2

[projects."/home/d-chiba/work/kaggle/rsna2026"]
trust_level = "trusted"

[projects."/home/d-chiba/ghq/github.com/daikichiba9511/my-concierge"]
trust_level = "trusted"

[hooks.state]

[hooks.state."/home/d-chiba/.codex/hooks.json:pre_tool_use:0:0"]
trusted_hash = "sha256:e3ab5878007962f362f94bbc2e2d01f1af930641558995c99c431981f8e8f92b"

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true
